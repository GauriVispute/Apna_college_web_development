<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tags in HTML</title>
</head>
<body>
    <!-- // relative link for Image store in Local  // -->
    <img src="Dancer2.jpg" alt="Prabhu Deva" height="200px"> image 1 (Relative link)

    <!-- // Absolute link for Image store in Web  // -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwtqGSZwRv2nrZVgIKq92YqFvf41wDyb7ggvsu9I_t5Q&s=10" 
            alt="Cristiano Ronaldo" height="400px"> image 2 (Absolute link)
</body>
</html>
